services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - media_data:/srv/media:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
    env_file:
      - path: .env
        required: false
      - path: .env.docker
        required: false
    environment:
      RUN_MIGRATIONS: "1"
      COLLECTSTATIC: "1"
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - runtime_data:/app/runtime
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/admin/login/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  worker:
    build:
      context: .
    command: celery -A config worker --loglevel=info -Q default,sync,ai,marketplace,maintenance,billing,reports,notifications
    env_file:
      - path: .env
        required: false
      - path: .env.docker
        required: false
    environment:
      RUN_MIGRATIONS: "0"
      COLLECTSTATIC: "0"
    volumes:
      - media_data:/app/media
      - runtime_data:/app/runtime
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
    command: celery -A config beat --loglevel=info --schedule=/app/runtime/celerybeat/celerybeat-schedule
    env_file:
      - path: .env
        required: false
      - path: .env.docker
        required: false
    environment:
      RUN_MIGRATIONS: "0"
      COLLECTSTATIC: "0"
    volumes:
      - runtime_data:/app/runtime
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-reklam_analiz}
      POSTGRES_USER: ${DB_USER:-reklam_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  runtime_data:

{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}İşlem tamamlanamadı{% endblock %} | ReklamAnaliz.net</title>
    <style>
        * { box-sizing: border-box; }
        body { align-items: center; background: #070b1c; color: #e7edf5; display: flex; font-family: Inter, Arial, sans-serif; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
        main { max-width: 620px; text-align: center; width: 100%; }
        img { background: #fff; border-radius: 8px; max-width: 330px; padding: 8px; width: 80%; }
        .code { color: #35c2d1; display: block; font-size: 14px; font-weight: 800; margin-top: 28px; }
        h1 { font-size: clamp(30px, 6vw, 48px); margin: 10px 0; }
        p { color: #aab6c7; line-height: 1.7; margin: 0 auto 24px; max-width: 520px; }
        a { background: #fff; border-radius: 7px; color: #111827; display: inline-block; font-weight: 800; padding: 12px 18px; text-decoration: none; }
    </style>
</head>
<body>
<main>
    <a href="{% url 'index' %}" style="background:transparent;padding:0"><img src="{% static 'images/logo2.png' %}" alt="ReklamAnaliz.net"></a>
    <span class="code">{% block code %}{% endblock %}</span>
    <h1>{% block heading %}{% endblock %}</h1>
    <p>{% block message %}{% endblock %}</p>
    <a href="{% url 'index' %}">Ana Sayfaya Dön</a>
</main>
</body>
</html>

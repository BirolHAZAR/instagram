<!doctype html>
<html lang="tr">
<body style="margin:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#111827;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7fb;padding:28px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="620" cellspacing="0" cellpadding="0" style="width:620px;max-width:94%;background:#ffffff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;">
          <tr><td style="background:#0f766e;color:#ffffff;padding:20px 24px;"><div style="font-size:13px;color:#ccfbf1;font-weight:700;">ReklamAnaliz.net</div><h1 style="margin:8px 0 0;font-size:23px;">Yeni iletişim mesajı</h1></td></tr>
          <tr>
            <td style="padding:24px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;font-size:14px;">
                <tr><td style="padding:10px;border-bottom:1px solid #eef2f7;color:#64748b;width:150px;">Ad Soyad</td><td style="padding:10px;border-bottom:1px solid #eef2f7;font-weight:700;">{{ contact.name }}</td></tr>
                <tr><td style="padding:10px;border-bottom:1px solid #eef2f7;color:#64748b;">E-posta</td><td style="padding:10px;border-bottom:1px solid #eef2f7;"><a href="mailto:{{ contact.email }}" style="color:#2563eb;">{{ contact.email }}</a></td></tr>
                <tr><td style="padding:10px;border-bottom:1px solid #eef2f7;color:#64748b;">Konu</td><td style="padding:10px;border-bottom:1px solid #eef2f7;">{{ contact.subject }}</td></tr>
              </table>
              <div style="margin-top:18px;padding:16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;">
                <strong style="display:block;margin-bottom:8px;">Mesaj</strong>
                <div style="white-space:pre-line;color:#334155;line-height:1.55;">{{ contact.message }}</div>
              </div>
              <p style="margin:18px 0 0;color:#64748b;font-size:12px;">Kayıt zamanı: {{ contact.created_at|date:"d.m.Y H:i" }}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
